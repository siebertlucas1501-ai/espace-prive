<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Espace privé</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🔐 Espace privé</h1>

        <div class="subtitle">
            Connecte-toi à ton espace
        </div>

        <form id="loginForm">

            <label for="username">
                Identifiant
            </label>

            <input
                type="text"
                id="username"
                placeholder="Ton identifiant"
                autocomplete="username"
                required
            >

            <label for="password">
                Mot de passe
            </label>

            <input
                type="password"
                id="password"
                placeholder="Ton mot de passe"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Se connecter
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            message.style.color = "#2563eb";
            message.textContent = "Connexion en cours...";

            /*
             * Le système de connexion sécurisé sera branché ici
             * avec notre Supabase Edge Function.
             */

            console.log("Identifiant :", username);

            message.style.color = "#dc2626";
            message.textContent = "Le système de connexion est en cours de configuration.";
        });
    </script>

</body>
</html>
