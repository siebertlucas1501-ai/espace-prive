
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partager mon écran</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 16px; }
    input, button { padding: 10px; margin: 5px 0; }
    button { cursor: pointer; }
    video { width: 100%; background: #111; margin-top: 15px; }
    #status { padding: 12px; background: #eee; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Partager mon écran</h1>
  <p>Entre l'identifiant d'une session acceptée, puis autorise le partage dans la fenêtre du navigateur.</p>
  <label for="sessionId">Identifiant de session</label><br>
  <input id="sessionId" style="width:min(95%,420px)" placeholder="UUID de la session">
  <br>
  <button id="start">Choisir l'écran et partager</button>
  <button id="stop" disabled>Arrêter le partage</button>
  <div id="status">Vérification de la connexion…</div>
  <video id="preview" autoplay muted playsinline></video>

<script>
const SUPABASE_URL = "https://fzbbyokmekokezllvjxh.supabase.co";
const SUPABASE_KEY = "sb_publishable_waUuAnVTwWR5fCc6g30bPw_iC5b7uBE";

const statusEl = document.getElementById("status");
const preview = document.getElementById("preview");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");

let client;
let channel;
let pc;
let stream;
let sessionId;
let userId;
let stopped = false;
let pendingCandidates = [];

function status(message) {
  statusEl.textContent = message;
}

async function init() {
  const token = sessionStorage.getItem("access_token");
  if (!token) {
    status("Connecte-toi d'abord à l'espace privé.");
    startButton.disabled = true;
    return;
  }

  client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    accessToken: async () => sessionStorage.getItem("access_token")
  });

  const { data, error } = await client.auth.getUser(token);
  if (error || !data.user) {
    status("Connexion expirée. Reconnecte-toi.");
    startButton.disabled = true;
    return;
  }

  userId = data.user.id;
  status("Connecté. Prêt à partager après autorisation.");
}

async function sendSignal(event, payload) {
  if (!channel) throw new Error("Canal Realtime absent.");
  const result = await channel.send({
    type: "broadcast",
    event,
    payload
  });
  if (result !== "ok") throw new Error("Envoi du signal impossible.");
}

async function start() {
  try {
    stopped = false;
    pendingCandidates = [];
    sessionId = document.getElementById("sessionId").value.trim();

    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(sessionId)) {
      status("Entre un identifiant de session valide.");
      return;
    }

    const { data: session, error } = await client
      .from("screen_share_sessions")
      .select("id, requester_id, target_user_id, status")
      .eq("id", sessionId)
      .maybeSingle();

    if (error || !session) {
      status("Session introuvable ou accès refusé.");
      return;
    }

    if (session.status !== "accepted" ||
        ![session.requester_id, session.target_user_id].includes(userId)) {
      status("Session non acceptée ou utilisateur non autorisé.");
      return;
    }

    // Le navigateur demandera explicitement quelle fenêtre ou quel écran partager.
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: false
    });
    preview.srcObject = stream;

    pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    stream.getTracks().forEach(track => {
      pc.addTrack(track, stream);
      track.onended = () => stop(true);
    });

    channel = client.channel("screen-share:" + sessionId, {
      config: { private: true, broadcast: { self: false } }
    });

    channel.on("broadcast", { event: "answer" }, async ({ payload }) => {
      if (stopped || !payload?.description || !pc) return;
      try {
        await pc.setRemoteDescription(payload.description);
        for (const candidate of pendingCandidates) {
          await pc.addIceCandidate(candidate);
        }
        pendingCandidates = [];
        status("Réponse reçue. Connexion à l'ordinateur distant…");
      } catch (e) {
        status("Erreur de réponse WebRTC : " + e.message);
      }
    });

    channel.on("broadcast", { event: "ice" }, async ({ payload }) => {
      if (stopped || !payload?.candidate || !pc) return;
      try {
        if (pc.remoteDescription) {
          await pc.addIceCandidate(payload.candidate);
        } else {
          pendingCandidates.push(payload.candidate);
        }
      } catch (e) {
        console.error("Candidat ICE non ajouté", e);
      }
    });

    channel.on("broadcast", { event: "stop" }, async () => {
      status("Le visionnage a été arrêté par l'autre participant.");
      await stop(false);
    });

    const subscription = await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error("Délai Realtime dépassé.")), 10000);
      channel.subscribe(result => {
        if (result === "SUBSCRIBED") {
          clearTimeout(timeout);
          resolve(result);
        } else if (result === "CHANNEL_ERROR" || result === "TIMED_OUT") {
          clearTimeout(timeout);
          reject(new Error("Abonnement Realtime refusé : " + result));
        }
      });
    });

    pc.onicecandidate = async event => {
      if (!event.candidate || stopped) return;
      try {
        await sendSignal("ice", { candidate: event.candidate });
      } catch (e) {
        console.error(e);
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await sendSignal("offer", { description: pc.localDescription });

    startButton.disabled = true;
    stopButton.disabled = false;
    status("Offre envoyée. En attente de la réponse du visionneur…");
  } catch (e) {
    status("Erreur : " + e.message);
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    preview.srcObject = null;
  }
}

async function stop(notify = true) {
  stopped = true;

  if (notify && channel) {
    try { await sendSignal("stop", {}); } catch (_) {}
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  if (pc) {
    pc.close();
    pc = null;
  }

  if (channel && client) {
    await client.removeChannel(channel);
    channel = null;
  }

  preview.srcObject = null;
  startButton.disabled = false;
  stopButton.disabled = true;
  status("Partage arrêté.");
}

startButton.addEventListener("click", start);
stopButton.addEventListener("click", () => stop(true));
init();
</script>
</body>
</html>
